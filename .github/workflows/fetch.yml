# runs the fetcher every 3 hours and saves its results into the repo
name: fetch
on:
  schedule:
    - cron: "17 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency: fetch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m placement_radar.run
      - name: commit data
        run: |
          git config user.name "placement-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: fetch $(date -u +%F-%H%M)"
          git push